name: API probe
on:
  push:
    branches: [api-probe]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/probe.py
      - run: |
          git config user.name "probe-bot"; git config user.email "probe@users.noreply.github.com"
          git checkout --orphan api-samples
          git rm -rfq --cached . >/dev/null
          git add samples
          git commit -qm "API samples $(date -u +%FT%TZ)"
          git push -f origin api-samples
