name: Build & Release

# 推到 main 時建置；若 package.json 的版本還沒有對應的 Release，就自動發布 v<版本>。
# 電腦版與手機版會從 Releases 的「Latest」自動更新。
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"; echo "v$VER 已發布過，只建置不發布"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"; echo "將發布 v$VER"
          fi

  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PW"
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../StockSim-${{ needs.prepare.outputs.version }}.apk
          else
            if [ "${{ needs.prepare.outputs.release }}" = "true" ]; then
              echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD 密鑰，無法發布正式版（自動更新需要固定簽章）。請到 Settings → Secrets and variables → Actions 新增後重新執行。"
              exit 1
            fi
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../StockSim-${{ needs.prepare.outputs.version }}-debug.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: android, path: 'StockSim-*.apk' }

  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never -c.win.signAndEditExecutable=true
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  release:
    needs: [prepare, android, windows]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Release notes
        run: |
          VER=${{ needs.prepare.outputs.version }}
          awk -v v="## v$VER" '$0==v{f=1;next} /^## v/{f=0} f' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "StockSim v$VER" > notes.md
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: StockSim v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          make_latest: 'true'
          files: |
            out/*.exe
            out/*.blockmap
            out/latest.yml
            out/*.apk
